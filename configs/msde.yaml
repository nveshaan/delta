# Settings for scripts/run_msde.py: MSDE on the embeddings of one encoder.
defaults:
  - _self_
  - density: default
  - score: default
  - weight: default
  - stability: default
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

hydra:
  run:
    dir: .
  sweep:
    dir: .
    subdir: ""
  output_subdir: null
  job:
    chdir: false

data_root: ${oc.env:DELTA_DATA,data}
modality: chest
encoder: CLIP
dataset: null   # null runs every dataset listed in configs/datasets/<modality>.yaml
seed: 42
cap: 10000
dist: euclidean

# Extra MSDE runs. Round 0 runs without labels; every later round re-runs on the original embeddings with
# pseudo labels from the previous round's score (top `anomaly_fraction` by score = 1, rest = 0), so points are
# only pulled towards presumed-normal neighbours (label 0).
pseudo_labels:
  rounds: 1   # total number of MSDE runs; 1 = a single run, no pseudo labels
  anomaly_fraction: 0.2

# "original: X" marks the value of the MSDE paper (arXiv:2602.03293, Table 3). The paper's MSDE also needs
# score=original (plain k nearest neighbours), dist=euclidean, and the default density, weight and stability.
# Unmarked values are not in the paper (its density weights equal the defaults here). The overrides that run it
# are at the end of this file. Differences that remain: exact neighbours instead of NN-Descent, the whole set at once instead of mini-batches,
# and the raw summed movement as the score instead of its sigmoid(z-score) (same ranking, same AUROC/AUPRC).
model:
  _target_: src.msde.MeanShiftDensityEnhancement
  k: 100                              # original: 100
  nbd_sample_count_threshold: 70      # original: 70
  n_neighbors: 15
  n_epochs: 200
  max_iters_weight_count: 4           # original: 4
  satisfiability_proportion: 0.3      # original: 0.3
  learning_rate: 0.1                  # original: 0.1
  max_iters_shift: 1000               # original: 1000
  shift_threshold: 1.0e-4             # original: 1.0e-4
  chunk_size: 1024
  recompute_neighbors: 0              # original: 1 (reselect neighbours every iteration)
  sphere: 2   # 0 raw feature space, 1 unit sphere, 2 unit sphere after Fréchet-mean centring. original: 0
  distance_strength: 1.0              # unused with score=original
  density_strength: 1.0               # original: 1.0 (weights = density counts)
  stability_strength: 1.0             # irrelevant without a stability function (stability stays 1)
  h: auto                             # unused with score=original

mlflow:
  tracking_uri: sqlite:///experiments/mlflow.db
  experiment_name: msde

# The original MSDE of the paper (arXiv:2602.03293), with Hydra overrides of the settings above:
#   python scripts/run_msde.py score=original dist=euclidean model.sphere=0 model.recompute_neighbors=1
# density, weight and stability stay at their defaults. Add modality=<name> encoder=<name> dataset=<name> as usual.
