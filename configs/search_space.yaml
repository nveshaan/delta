# Optuna search spaces (Hydra sweep syntax) for configs/experiment/optuna.yaml.
# Not a composable config: utils/search_space.py reads it and samples
# method.<key> from the selected method's section, plus msde.<key> when
# mlp_targets is scores or distances.

method:
  fuse:
    k_nn: range(5, 40, step=5)
    k_vote: choice(3, 5, 7, 9)
    confidence: interval(0.5, 0.95)
    k_embed: range(50, 300, step=50)
    learning_rate: tag(log, interval(0.005, 0.2))
    lambda_modularity: interval(0.1, 4.0)
    lambda_supervised: interval(0.1, 4.0)
    lambda_random_walk: interval(0.1, 4.0)
  knnvote_msde:
    k_vote: choice(3, 5, 7, 9, 11)
    em_rounds: range(1, 8)
    gate_sharpness: interval(0.25, 4.0)
    msde_k: range(10, 100, step=10)
    msde_learning_rate: interval(0.05, 0.6)
    msde_nbd_sample_count_threshold: range(20, 120, step=10)
    confidence: interval(0.5, 0.95)
  laplacianshot:
    k_nn: range(5, 40, step=5)
    lambda_laplacian: interval(0.05, 2.0)
    confidence: interval(0.5, 0.95)
  laplacianshot_msde:
    laplacian_k: range(5, 40, step=5)
    laplacian_lambda: interval(0.1, 0.95)
    em_rounds: range(1, 8)
    gate_sharpness: interval(0.25, 4.0)
    msde_k: range(10, 100, step=10)
    msde_learning_rate: interval(0.05, 0.6)
    msde_nbd_sample_count_threshold: range(20, 120, step=10)
    confidence: interval(0.5, 0.95)

msde:
  k: range(10, 100, step=10)
  learning_rate: interval(0.05, 0.6)
  max_iters_shift: range(2, 16)
  nbd_sample_count_threshold: range(20, 120, step=10)
