# Optuna search spaces (Hydra sweep syntax), read by utils/search_space.py.
# Not a composable config. Two stages:
#
#   method  configs/experiment/optuna_method.yaml (few_shot.py) samples
#           method.<key> from the selected method's section.
#   msde    configs/experiment/optuna_msde.yaml (distill_mlp.py) samples
#           msde.<key> with the method's stage-1 best parameters fixed.
#
# `confidence` is not searched: it is only validated, never applied (no stage
# calls filter_by_confidence), so it cannot change results.

method:
  laplacianshot:
    k_nn: range(5, 40, step=5)
    lambda_laplacian: interval(0.05, 2.0)
  laplacianshot_msde:
    laplacian_k: range(5, 40, step=5)
    laplacian_lambda: interval(0.1, 0.95)
    em_rounds: range(1, 11)
    gate_sharpness: interval(0.25, 4.0)
    msde_k: range(10, 100, step=10)
    msde_learning_rate: interval(0.05, 0.6)
    msde_inner_iterations: range(5, 300, step=25)
    msde_nbd_sample_count_threshold: range(20, 120, step=10)

msde:
  k: range(10, 100, step=10)
  learning_rate: interval(0.05, 0.6)
  max_iters_shift: range(5, 300, step=25)
  nbd_sample_count_threshold: range(20, 120, step=10)
