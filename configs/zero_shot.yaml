defaults:
  - _self_
  - modality: chest
  - method: fuse
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

hydra:
  run:
    dir: .
  sweep:
    dir: ${oc.env:TMPDIR,/tmp}/delta_hydra
    subdir: ""
  output_subdir: null
  job:
    chdir: false

encoder: CLIP
split: test
support_size: 5
mlp_targets: scores
# mlp_targets: labels | scores | distances
# distill_mlp run to evaluate; null picks the latest finished run matching the settings above.
distill_run_id: null
# Restrict the search to the runs of one distill_mlp trial (tags.trial_hash);
# otherwise to the distill_mlp runs of this campaign.
trial_hash: null
campaign: adhoc
seed: 42
device: auto

mlp:
  _target_: models.VanillaNetwork

mlflow:
  tracking_uri: sqlite:///experiments/mlruns.db
  artifact_location: experiments/mlartifacts
  experiment_name: delta
  run_name: zero_shot_${hydra:runtime.choices.method}_${modality.modality}_${encoder}
  type: zero_shot
