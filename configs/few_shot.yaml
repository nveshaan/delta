defaults:
  - _self_
  - modality: chest
  - method: fuse
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

hydra:
  run:
    dir: .
  sweep:
    dir: ${oc.env:TMPDIR,/tmp}/delta_hydra
    subdir: ""
  output_subdir: null
  job:
    chdir: false

encoder: CLIP
split: train
support_size: 5
seed: 42

# MLP distillation target: labels (pseudolabels), scores (MSDE + GDE), or
# distances (MSDE total_distance); scores/distances use msde.mode.
mlp_targets: scores
distill_mlp: true

msde:
  # MSDE before GDE scoring / for distances: no_msde | msde | same_label | zero_label
  # (distances cannot use no_msde)
  mode: msde
  k: 50
  nbd_sample_count_threshold: 70
  learning_rate: 0.33
  max_iters_shift: 8
  shift_threshold: 0.01
  device: auto
  use_chunking: true
  weight_chunk_size: 2048
  enable_gradients: false

mlp:
  _target_: models.VanillaNetwork

training:
  epochs: 30
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  validation_fraction: 0.15
  patience: 7
  seed: ${seed}

mlflow:
  tracking_uri: sqlite:///experiments/mlruns.db
  artifact_location: experiments/mlartifacts
  experiment_name: delta
  run_name: ${hydra:runtime.choices.method}_${modality.modality}
  type: few_shot
