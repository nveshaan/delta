defaults:
  - _self_
  - modality: chest
  - method: fuse
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

hydra:
  run:
    dir: .
  sweep:
    dir: ${oc.env:TMPDIR,/tmp}/delta_hydra
    subdir: ""
  output_subdir: null
  job:
    chdir: false

encoder: CLIP
split: train
support_size: 5
seed: 42
# Device for pseudolabeling (and MSDE/MLP in distill_mlp.py): auto | cpu | cuda | mps
device: auto

# Run every support_sizes x modalities combination in turn, e.g. [5, 10] and
# [chest, fundus, mri, oct], and return the mean of their objectives (equal
# weight per modality and support size); null runs `support_size` / `modality`.
support_sizes: null
modalities: null
# Free-form label for grouping runs (tags.campaign); not part of the config hashes.
campaign: adhoc
# Delete an identical finished run and run again (same as passing --redo).
redo: false

mlflow:
  tracking_uri: sqlite:///experiments/mlruns.db
  artifact_location: experiments/mlartifacts
  experiment_name: delta
  run_name: ${hydra:runtime.choices.method}_${modality.modality}
  type: few_shot
