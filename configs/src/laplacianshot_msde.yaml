_target_: src.laplacianshot_msde.LaplacianShotMSDEPseudolabeler

# LaplacianShot propagation on the query graph.
mode: label_aware_msde  # no_msde | msde | label_aware_msde
laplacian_k: 20
laplacian_lambda: 0.7
laplacian_iterations: 20
laplacian_tolerance: 1.0e-4

# EM alternation and confidence-gated query movement.
em_rounds: 5
em_convergence_tolerance: 0.01
gate_sharpness: 1.0

# Partial MSDE shift performed in every EM round.
msde_k: 50
msde_learning_rate: 0.33
msde_nbd_sample_count_threshold: 70
msde_shift_threshold: 0.01
msde_inner_iterations: 3

n_classes: null
confidence: 0.75
seed: 42
device: auto
